services:
  superset:
    image: plantpulse-superset:6.1.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plantpulse-superset
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_HOME: /app/superset_home
      SUPERSET_PORT: "8088"
      SUPERSET_BIND_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:8088:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - superset_home:/app/superset_home
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./provision_dashboards.py:/app/provision_dashboards.py:ro
    command:
      - /bin/sh
      - -c
      - superset db upgrade && superset init && exec /usr/bin/run-server.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  superset_home:
    name: plantpulse-superset-home
